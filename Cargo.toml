[workspace]
resolver = "2"
members = [
    "abi",
    "ai-classifier",
    "audit-chain",
    "cli",
    "column-mask",
    "cost-governor",
    "llm-guardrail",
    "pgvector-router",
    "residency-router",
    "token-budget",
]
# `cli/` is a host binary (not a wasm plugin) — exclude from the
# default workspace `cargo build --target wasm32-...` runs.
default-members = [
    "abi",
    "ai-classifier",
    "audit-chain",
    "column-mask",
    "cost-governor",
    "llm-guardrail",
    "pgvector-router",
    "residency-router",
    "token-budget",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "AGPL-3.0-only"
repository = "https://github.com/dimensigon/heliosdb-proxy-plugins"
rust-version = "1.75"

[workspace.dependencies]
# Plugins are compiled to wasm32-unknown-unknown — the proxy hosts them
# via wasmtime. We keep dependencies thin to minimise .wasm size, but
# default to std features for ergonomic use of HashMap and friends.
# Plugins that need a true no_std build can override.
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Test-only: tempdirs for the CLI integration tests so signature +
# artefact scaffolding stays scoped.
tempfile = "3"

# Shared ABI: alloc/dealloc + i64 packing + mirror types for the proxy's
# QueryContext / PreQueryResult / PostQueryOutcome serde shapes.
helios-plugin-abi = { path = "abi", version = "0.1.0" }

[profile.release]
opt-level     = "z"          # size-optimised wasm
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
