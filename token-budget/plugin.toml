name        = "helios-plugin-token-budget"
version     = "0.1.0"
description = "Per-agent / per-model query-cost budget enforcement"
author      = "HeliosProxy contributors"
license     = "Apache-2.0"
hooks       = ["pre_query", "post_query"]
permissions = ["kv_read", "kv_write", "metric_inc"]
min_memory  = 1048576
max_memory  = 16777216

# Order: must run AFTER ai-classifier so ai_traffic=true is already set.
priority    = 50
